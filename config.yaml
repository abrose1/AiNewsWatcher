sms:
  first_name: "Andrew"
  # to_number and from_number come from env vars (SMS_TO_NUMBER, TWILIO_FROM_NUMBER)

news:
  # Strategy: ask broad "what's the biggest story" questions rather than
  # enumerating every lab. The judge does the filtering.
  standing_queries:
    - "biggest AI news today"
    - "top artificial intelligence story today"
    - "major AI announcement this week"
    - "AI breakthrough this week"
    - "new frontier AI model released"
    - "notable AI research paper this week"
    - "AI industry funding or acquisition this week"
    - "AI safety or alignment news this week"
    - "AI regulation or policy news this week"
    - "open source AI model release this week"
  lookback_hours: 24
  max_candidates: 15

llm:
  model: "claude-sonnet-4-6"
  takeover_threshold_notes: |
    DEFAULT TO REJECTING. Most days, nothing in the news should clear this bar
    — on a typical day you should return takeover=false. Think of this as
    promoting maybe one story per week, not per day. If you find yourself
    rationalizing why something is "kind of" worth a takeover, the answer
    is no.

    The bar: only flag a story if Andrew would feel actively misinformed
    not knowing about it by tomorrow. It should be the kind of thing that
    will still be talked about in industry conversations a week from now.

    Genuinely-worth-it categories (still apply the bar above — being in a
    category is necessary, not sufficient):
      - Frontier-tier model launches that meaningfully shift capability or
        cost frontiers (a flagship model from a top lab; not incremental
        Flash/Mini/Haiku tiers unless they post surprising benchmarks)
      - SOTA benchmark results that change the leaderboard picture
      - Funding rounds >$500M or acquisitions that reshape the landscape
      - Leadership changes at top labs (CEO, chief scientist, head of safety)
      - Significant regulatory milestones with real enforcement
      - Major unexpected open-source releases (the kind that surprise people)
      - AI safety/governance incidents with real stakes (not speculation)

    When in doubt, return takeover=false. The seed-fact branch is a perfectly
    good fallback and runs by default.

