sms:
  first_name: "Andrew"
  # to_number and from_number come from env vars (SMS_TO_NUMBER, TWILIO_FROM_NUMBER)

news:
  # Strategy: ask broad "what's the biggest story" questions rather than
  # enumerating every lab. The judge does the filtering.
  standing_queries:
    - "biggest AI news today"
    - "top artificial intelligence story today"
    - "major AI announcement this week"
    - "AI breakthrough this week"
    - "new frontier AI model released"
    - "notable AI research paper this week"
    - "AI industry funding or acquisition this week"
    - "AI safety or alignment news this week"
    - "AI regulation or policy news this week"
    - "open source AI model release this week"
  lookback_hours: 24
  max_candidates: 15

llm:
  model: "claude-sonnet-4-6"
  takeover_threshold_notes: |
    Mark takeover-worthy only for events that a well-informed industry observer
    would call genuinely notable, including but not limited to:
      - Frontier model launches from any serious lab (US, EU, Chinese, or other)
      - SOTA benchmark beats or new evaluation results that shift perception
      - Major funding rounds (>$300M) or acquisitions
      - Leadership changes at top labs (CEO, chief scientist, head of safety)
      - Significant regulatory milestones (laws passed, major executive actions)
      - Clearly viral product launches or unexpected open-source releases
      - AI safety incidents (jailbreaks, capability surprises, governance disputes)
    Reject: incremental blog updates, speculative thinkpieces, listicles, rumors
    without sourcing, and routine product polish.

