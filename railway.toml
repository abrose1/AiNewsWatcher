# Default Railway config (used by the inbound-webhook service).
#
# Cron services point at railway.weekday.toml and railway.weekend.toml via
# the "Config Path" setting in their Service → Settings → Source pane.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn watcher.web:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
