# Default Railway config (used by the inbound-webhook service).
#
# Cron services point at railway.weekday.toml and railway.weekend.toml via
# the "Config Path" setting in their Service → Settings → Source pane.

[build]
builder = "NIXPACKS"

[deploy]
# --proxy-headers + --forwarded-allow-ips="*" so Starlette/FastAPI sees the
# original https:// scheme from Railway's proxy. Without this, Twilio signs
# https://... but request.url returns http://..., breaking signature validation.
startCommand = "uvicorn watcher.web:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
