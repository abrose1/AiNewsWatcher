# Cron config for the weekend daily-fact service.
# Sat-Sun 1:00 PM Arizona (MST, UTC-7) = Sat-Sun 20:00 UTC.
#
# Set the service's "Config Path" to railway.weekend.toml in
# Service → Settings → Source.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m watcher.jobs.daily_fact"
restartPolicyType = "NEVER"
cronSchedule = "0 20 * * 0,6"
